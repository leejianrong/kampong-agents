# yaml-language-server: $schema=../packages/spec/schemas/agent-spec.v1.0.schema.json
#
# Starter spec for trying the canvas + kampong run. `make up` copies this
# into ./workspace/agent.yaml (gitignored, so your own edits there never
# touch this tracked copy) the first time you bring the stack up.
version: "1.0"
agent:
  id: hello_agent
  name: "Hello Agent"
  role: "Friendly assistant"
  goal: "Greet the user warmly and answer one question in a concise, helpful tone."
  # Default: OpenRouter -- zero local setup, just an API key. Cheap by
  # design: liquid/lfm-2.5-2.6b:free is a free-tier OpenRouter model (see
  # openrouter.ai/models), good enough for this hello-world workflow.
  # Set OPENROUTER_API_KEY in .env (get one at openrouter.ai/keys).
  model:
    provider: openrouter
    name: liquid/lfm-2.5-2.6b:free
    api_key: ${OPENROUTER_API_KEY}

  # Alternative: Ollama -- fully offline and free, but needs `ollama serve`
  # running locally (and `ollama pull llama3.2`) plus, via `make up`
  # (Docker), a host-reachable base_url ("localhost" from inside the
  # container means the container itself, not your machine -- that's what
  # host.docker.internal is for). Uncomment this and comment out the
  # openrouter block above to use it instead; running `kampong dev`/
  # `kampong run` directly (no Docker) instead, change base_url to
  # http://localhost:11434.
  # model:
  #   provider: ollama
  #   name: llama3.2
  #   base_url: http://host.docker.internal:11434

  workflow:
    - step: greet
      action: generate_text
      inputs: [input]
