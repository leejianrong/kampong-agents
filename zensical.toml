    { "Backup and restore runbook" = "hosted/restore-runbook.md" },
    { "Availability and status" = "hosted/availability.md" },
    { "Incident history" = "hosted/incidents.md" },
    { "Security and data handling" = "hosted/security.md" },
    { "Subprocessors" = "hosted/subprocessors.md" },
    { "Data processing agreement (draft)" = "hosted/dpa.md" },
    { "Architecture" = "hosted/architecture.md" },
    { "Flows" = "hosted/flows.md" },
