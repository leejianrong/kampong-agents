# A throwaway S3-compatible store for the restore drill (KAM-329). Credentials are fixed and public on purpose: it holds
# nothing and is never exposed. A real install points the chart at its own bucket (docs/hosted/restore-runbook.md).
apiVersion: v1
kind: Secret
metadata:
  name: kampong-postgres-s3-credentials
stringData:
  ACCESS_KEY_ID: drill
  ACCESS_SECRET_KEY: drill-secret-key
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
spec:
  replicas: 1
  selector:
    matchLabels: { app: minio }
  template:
    metadata:
      labels: { app: minio }
    spec:
      containers:
        - name: minio
          image: minio/minio:RELEASE.2024-10-13T13-34-11Z
          args: ["server", "/data"]
          env:
            - { name: MINIO_ROOT_USER, value: drill }
            - { name: MINIO_ROOT_PASSWORD, value: drill-secret-key }
          ports:
            - containerPort: 9000
          readinessProbe:
            httpGet: { path: /minio/health/ready, port: 9000 }
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: minio
spec:
  selector: { app: minio }
  ports:
    - port: 9000
---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-make-bucket
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc:RELEASE.2024-10-08T09-37-26Z
          command:
            - sh
            - -c
            - mc alias set drill http://minio:9000 drill drill-secret-key && mc mb --ignore-existing drill/kampong-postgres-backups
