apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kampong-server.fullname" . }}
  labels:
    {{- include "kampong-server.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "kampong-server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "kampong-server.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.service.targetPort | quote }}
            - name: HOST
              value: "0.0.0.0"
            {{- if .Values.ingress.enabled }}
            - name: TRUST_PROXY
              value: "true"
            {{- end }}
            {{- with .Values.ingressLimits }}
            {{- if .deploymentPerMinute }}
            - name: INGRESS_DEPLOYMENT_PER_MINUTE
              value: {{ .deploymentPerMinute | quote }}
            {{- end }}
            {{- if .ipPerMinute }}
            - name: INGRESS_IP_PER_MINUTE
              value: {{ .ipPerMinute | quote }}
            {{- end }}
            {{- if .maxBodyBytes }}
            - name: INGRESS_MAX_BODY_BYTES
              value: {{ .maxBodyBytes | quote }}
            {{- end }}
            {{- end }}
            {{- $publicBaseUrl := .Values.publicBaseUrl | default (ternary (printf "https://%s" .Values.ingress.host) (printf "http://%s" .Values.ingress.host) .Values.ingress.tls.enabled) }}
            {{- if .Values.ingress.enabled }}
            - name: PUBLIC_BASE_URL
              value: {{ $publicBaseUrl | quote }}
            {{- else if .Values.publicBaseUrl }}
            - name: PUBLIC_BASE_URL
              value: {{ .Values.publicBaseUrl | quote }}
            {{- end }}
            {{- with .Values.previewNotice }}
            - name: PREVIEW_NOTICE
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
