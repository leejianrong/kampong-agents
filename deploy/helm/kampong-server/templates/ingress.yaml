{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "kampong-server.fullname" . }}
  labels:
    {{- include "kampong-server.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  # k3s's bundled Traefik registers this IngressClass by default (ADR-0013)
  # -- a plain networking.k8s.io/v1 Ingress targeting it, not Traefik's own
  # IngressRoute CRD, is enough for this scaffold's single host/service.
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "kampong-server.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
