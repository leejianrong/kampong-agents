# Default values for kampong-server (ADR-0013, KAN-1221; migrationJob added
# by KAN-1223, ADR-0014).
# This chart stands up the packages/server Deployment/Service/Ingress, plus
# (as of KAN-1223) a Helm-hook Job that applies Drizzle migrations against
# the Postgres this same server will eventually consume (KAN-1224+). It does
# not stand up Postgres itself (KAN-1222 -- CloudNativePG per ADR-0013, a
# separate chart), no cert-manager ClusterIssuer, no LiteLLM Deployment.
# Those are separate, later charts/cards; wiring this chart's Ingress TLS or
# actually consuming a DB connection string from packages/server's own
# routes is out of scope here (KAN-1224+).

# One replica until two replicas are shown to fire a schedule once (KAM-340). An approval can now be resolved on
# any replica (KAM-348). Limits are per replica (KAM-322). See ADR-0066. A live run's event stream still only
# updates on the replica running it; approvals and reads work from any.
replicaCount: 1

# A sentence pinned to the top of every screen (PREVIEW_NOTICE, KAM-320). Set it while the service has no SLA.
previewNotice: ""

image:
  repository: kampong-server
  # Defaults to the chart's appVersion (Chart.yaml) when empty, matching
  # Helm's own convention (see templates/deployment.yaml) -- override with a
  # real registry tag (e.g. a git SHA or semver) at deploy time.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Overrides the chart/release name used to derive object names and the
# `app.kubernetes.io/name` label (templates/_helpers.tpl) -- leave empty to
# use the chart name.
nameOverride: ""
fullnameOverride: ""

# The public origin webhook addresses are built from (PUBLIC_BASE_URL, KAM-321), e.g. https://kampong.abangai.dev.
# Leave empty to derive it from ingress.host (https when ingress.tls.enabled, else http).
publicBaseUrl: ""

# Limits on the public webhook endpoint (KAM-322). Empty uses the server defaults: 120 requests a minute per
# deployment, 600 per client address, and a 256 KiB body. Limits are per replica.
ingressLimits: {}
#  deploymentPerMinute: 120
#  ipPerMinute: 600
#  maxBodyBytes: 262144

# What one workspace may use (KAM-323). Empty uses the server defaults: 5 runs at once, 3000 runs a calendar month
# (UTC) and 15 minutes a run. 0 turns a limit off. Over the monthly figure the workspace's deployments are paused
# with the reason shown in the Deploy panel. The same limits apply to every workspace.
runLimits: {}
#  maxConcurrent: 5
#  maxPerMonth: 3000
#  maxMinutes: 15

# Dollars per million tokens, by model name, so the Usage panel can estimate cost (MODEL_PRICING_JSON, KAM-325).
# Empty means tokens are counted and no cost is shown: a price is never guessed.
modelPricing: {}
#  gpt-4o-mini: { inputPerMTok: 0.15, outputPerMTok: 0.6 }

# Where to report a vulnerability, served as /.well-known/security.txt (SECURITY_CONTACT, KAM-331). A mailto: address or
# an https:// URL. Leave empty and the file is not served. `policy` is the page that states the disclosure policy.
security: {}
#  contact: "mailto:security@your-domain.example"
#  policy: "https://your-domain.example/security"

service:
  type: ClusterIP
  port: 80
  # The container's own listening port (packages/server/src/main.ts's
  # `PORT` env var, EXPOSE 8080 in packages/server/Dockerfile).
  targetPort: 8080

ingress:
  enabled: true
  # k3s ships Traefik as its default ingress controller (ADR-0013) -- reuse
  # it via a plain networking.k8s.io/v1 Ingress rather than installing a
  # second controller or reaching for Traefik's own IngressRoute CRD, which
  # this deployment has no specific reason to prefer yet.
  className: traefik
  host: kampong.example.com
  # TLS is deliberately left disabled by default: cert-manager's
  # ClusterIssuer (ADR-0013) is a separate, later piece of cluster setup,
  # not something this scaffold chart should assume already exists. Flip
  # this on and name a real Secret once cert-manager is wired up.
  tls:
    enabled: false
    secretName: kampong-server-tls
  annotations: {}

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Extra environment variables merged onto the container -- a list of
# Kubernetes EnvVar objects, passed through as-is. This is where the server's
# secret-backed config is supplied, each `valueFrom.secretKeyRef` into a
# Secret this chart does NOT create (so it must already exist in the
# namespace):
#   - DATABASE_URL        -- the CNPG `<cluster>-app` Secret's `uri` key
#                            (KAN-1222; same value the migration Job uses).
#   - BETTER_AUTH_SECRET  -- Better Auth's session-signing secret (KAN-1226,
#                            ADR-0015); `openssl rand -base64 32`.
#   - BYOK_ROOT_KEY       -- the AES-256-GCM root key every stored BYOK
#                            provider key is encrypted under (KAN-1229,
#                            ADR-0016). A base64-encoded 32 bytes
#                            (`openssl rand -base64 32`). This is the single
#                            most sensitive artifact in the deployment:
#                            losing it permanently breaks every stored BYOK
#                            key, so it MUST have its own backup in the
#                            homelab DR runbook, separate from the database
#                            backup (ADR-0016 Consequences).
# Example:
#   extraEnv:
#     - name: BYOK_ROOT_KEY
#       valueFrom:
#         secretKeyRef:
#           name: kampong-server-secrets
#           key: byok-root-key
extraEnv: []

# The deploy-time Drizzle migration Job (ADR-0014, KAN-1223) --
# templates/migrate-job.yaml -- runs `node packages/server/dist/db/migrate.js`
# (the same image as the Deployment below) as a Helm pre-install/pre-upgrade
# hook, before the Deployment's new revision is rolled out. DATABASE_URL is
# sourced from the CNPG-generated `<cluster-name>-app` Secret (KAN-1222,
# deploy/helm/kampong-postgres) -- this chart does not create that Secret,
# only references it, so it must already exist in this release's namespace.
migrationJob:
  enabled: true
  # Name of the Secret CNPG auto-generates for the kampong-postgres Cluster
  # (deploy/helm/kampong-postgres/README.md: "<cluster-name>-app", e.g.
  # "kampong-postgres-app" for a release named "kampong-postgres" -- change
  # this if your Postgres release is named differently).
  databaseSecretName: "kampong-postgres-app"
  # Key inside that Secret holding a full postgres:// connection string --
  # CNPG's documented shape (username/password/dbname/host/port/uri/
  # jdbc-uri); `uri` is the DATABASE_URL-equivalent value.
  databaseSecretKey: "uri"
  backoffLimit: 3
  activeDeadlineSeconds: 300

podAnnotations: {}
podLabels: {}

nodeSelector: {}
tolerations: []
affinity: {}

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
