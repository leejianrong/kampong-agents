# Default values for kampong-server (ADR-0013, KAN-1221; migrationJob added
# by KAN-1223, ADR-0014).
# This chart stands up the packages/server Deployment/Service/Ingress, plus
# (as of KAN-1223) a Helm-hook Job that applies Drizzle migrations against
# the Postgres this same server will eventually consume (KAN-1224+). It does
# not stand up Postgres itself (KAN-1222 -- CloudNativePG per ADR-0013, a
# separate chart), no cert-manager ClusterIssuer, no LiteLLM Deployment.
# Those are separate, later charts/cards; wiring this chart's Ingress TLS or
# actually consuming a DB connection string from packages/server's own
# routes is out of scope here (KAN-1224+).

replicaCount: 1

image:
  repository: kampong-server
  # Defaults to the chart's appVersion (Chart.yaml) when empty, matching
  # Helm's own convention (see templates/deployment.yaml) -- override with a
  # real registry tag (e.g. a git SHA or semver) at deploy time.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Overrides the chart/release name used to derive object names and the
# `app.kubernetes.io/name` label (templates/_helpers.tpl) -- leave empty to
# use the chart name.
nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 80
  # The container's own listening port (packages/server/src/main.ts's
  # `PORT` env var, EXPOSE 8080 in packages/server/Dockerfile).
  targetPort: 8080

ingress:
  enabled: true
  # k3s ships Traefik as its default ingress controller (ADR-0013) -- reuse
  # it via a plain networking.k8s.io/v1 Ingress rather than installing a
  # second controller or reaching for Traefik's own IngressRoute CRD, which
  # this deployment has no specific reason to prefer yet.
  className: traefik
  host: kampong.example.com
  # TLS is deliberately left disabled by default: cert-manager's
  # ClusterIssuer (ADR-0013) is a separate, later piece of cluster setup,
  # not something this scaffold chart should assume already exists. Flip
  # this on and name a real Secret once cert-manager is wired up.
  tls:
    enabled: false
    secretName: kampong-server-tls
  annotations: {}

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Extra environment variables merged onto the container (e.g. future
# DATABASE_URL/session-secret entries from later cards) -- a list of
# Kubernetes EnvVar objects, passed through as-is.
extraEnv: []

# The deploy-time Drizzle migration Job (ADR-0014, KAN-1223) --
# templates/migrate-job.yaml -- runs `node packages/server/dist/db/migrate.js`
# (the same image as the Deployment below) as a Helm pre-install/pre-upgrade
# hook, before the Deployment's new revision is rolled out. DATABASE_URL is
# sourced from the CNPG-generated `<cluster-name>-app` Secret (KAN-1222,
# deploy/helm/kampong-postgres) -- this chart does not create that Secret,
# only references it, so it must already exist in this release's namespace.
migrationJob:
  enabled: true
  # Name of the Secret CNPG auto-generates for the kampong-postgres Cluster
  # (deploy/helm/kampong-postgres/README.md: "<cluster-name>-app", e.g.
  # "kampong-postgres-app" for a release named "kampong-postgres" -- change
  # this if your Postgres release is named differently).
  databaseSecretName: "kampong-postgres-app"
  # Key inside that Secret holding a full postgres:// connection string --
  # CNPG's documented shape (username/password/dbname/host/port/uri/
  # jdbc-uri); `uri` is the DATABASE_URL-equivalent value.
  databaseSecretKey: "uri"
  backoffLimit: 3
  activeDeadlineSeconds: 300

podAnnotations: {}
podLabels: {}

nodeSelector: {}
tolerations: []
affinity: {}

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
