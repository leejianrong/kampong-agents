{{- if .Values.backup.enabled -}}
# CNPG's own S3Credentials API (github.com/cloudnative-pg/barman-cloud
# pkg/api) models the S3 region as a SecretKeySelector, not a plain string --
# there is no inline-string field on the ObjectStore CR for it. Region isn't
# sensitive, so this chart materializes it into its own small, chart-managed
# Secret from values.yaml's plain `backup.objectStore.region` string, rather
# than requiring the operator to fold a non-secret value into the externally
# -created credentials Secret (README.md).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kampong-postgres.regionSecretName" . }}
  labels:
    {{- include "kampong-postgres.labels" . | nindent 4 }}
type: Opaque
stringData:
  REGION: {{ .Values.backup.objectStore.region | quote }}
{{- end -}}
