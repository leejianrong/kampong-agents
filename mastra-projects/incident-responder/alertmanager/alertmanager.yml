route:
  receiver: incident-responder
  group_by: ["alertname"]
  group_wait: 5s
  group_interval: 30s
  repeat_interval: 5m

receivers:
  - name: incident-responder
    webhook_configs:
      # host.docker.internal reaches the Node process running on the host
      # via `npm run dev`, outside this compose stack (README.md) -- the
      # bearer token is a real, if purely local, auth check: never skip
      # verifying an inbound webhook even when nothing outside your own
      # machine can reach it yet.
      - url: "http://host.docker.internal:8788/alertmanager-webhook"
        send_resolved: true
        http_config:
          authorization:
            credentials: "5df9f49d22deb682abade28f42a9a0a8fe3dc112"
