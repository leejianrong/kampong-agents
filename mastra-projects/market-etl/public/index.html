<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>market-etl</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/tokens.css" />
  <link rel="stylesheet" href="/dashboard.css" />
</head>
<body>
  <header class="app-bar">
    <div class="app-bar__title">
      <span class="app-bar__dot" id="connection-dot" aria-hidden="true"></span>
      <h1>market&#8209;etl</h1>
    </div>
    <p class="app-bar__subtitle">
      kampong-agents &middot; mastra-projects &middot; real Alpha Vantage &rarr; Supabase, autonomous anomaly alerts (no HITL)
    </p>
    <button id="run-button" type="button">Run now</button>
  </header>

  <main id="main">
    <section class="stat-strip" aria-label="Summary">
      <div class="stat-card">
        <span class="stat-card__value" id="stat-runs">0</span>
        <span class="stat-card__label">Runs</span>
      </div>
      <div class="stat-card">
        <span class="stat-card__value" id="stat-anomalies">0</span>
        <span class="stat-card__label">Anomalies flagged</span>
      </div>
      <div class="stat-card stat-card--status">
        <span class="stat-card__value" id="stat-connection">Connecting&hellip;</span>
        <span class="stat-card__label">Live feed</span>
      </div>
    </section>

    <section class="runs" id="runs" aria-label="Ingestion runs">
      <p class="empty-state" id="empty-state">
        No real runs yet &mdash; click "Run now" to pull real data from Alpha Vantage.
      </p>
    </section>

    <section class="anomalies-section" aria-label="Anomalies">
      <h2 class="section-title">Real anomalies flagged</h2>
      <div id="anomaly-list"></div>
    </section>
  </main>

  <template id="run-template">
    <article class="run-card">
      <header class="run-card__header">
        <span class="run-card__time"></span>
      </header>
      <div class="ingestion-strip"></div>
    </article>
  </template>

  <template id="symbol-template">
    <div class="symbol-lane">
      <span class="symbol-lane__symbol"></span>
      <div class="stepper">
        <div class="stepper__step" data-step="pull">
          <span class="stepper__dot"></span>
          <span class="stepper__label">Pull</span>
        </div>
        <div class="stepper__line" data-line="pull-validate"></div>
        <div class="stepper__step" data-step="validate">
          <span class="stepper__dot"></span>
          <span class="stepper__label">Validate</span>
        </div>
        <div class="stepper__line" data-line="validate-flag"></div>
        <div class="stepper__step" data-step="flag">
          <span class="stepper__dot"></span>
          <span class="stepper__label">Anomaly?</span>
        </div>
      </div>
      <span class="symbol-lane__detail"></span>
    </div>
  </template>

  <template id="anomaly-template">
    <article class="anomaly-card">
      <header>
        <span class="chip"></span>
        <span class="anomaly-card__time"></span>
      </header>
      <p></p>
    </article>
  </template>

  <script src="/dashboard.js"></script>
</body>
</html>
