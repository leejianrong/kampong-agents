kind: rest
id: kampong/slack
version: 1.0.0
title: Slack
description: Post messages to Slack with a bot token.
license: Apache-2.0
permissions:
  egress: [slack.com]
auth:
  slots:
    token:
      env: SLACK_BOT_TOKEN
      hosts: [slack.com]
      inject:
        header: Authorization
        template: "Bearer {{ secret }}"
      probe: { op: auth_test }
ops:
  auth_test:
    title: Check the token
    description: Asks Slack whether the bot token is valid (auth.test). Changes nothing.
    effect: read
    request:
      method: POST
      url: https://slack.com/api/auth.test
    failure_when:
      - path: ok
        equals: false
        message_path: error
    output:
      type: object
      properties:
        ok: { type: boolean }
        team: { type: string }
        user: { type: string }
  post_message:
    title: Post a message
    description: Posts text to a channel with chat.postMessage.
    effect: write
    input:
      type: object
      required: [channel, text]
      properties:
        channel:
          type: string
          title: Channel
          description: A channel name such as #support, or a channel id.
        text:
          type: string
          title: Text
          format: multiline
    request:
      method: POST
      url: https://slack.com/api/chat.postMessage
      headers:
        Content-Type: "application/json; charset=utf-8"
      body:
        json:
          channel: "{{ input.channel }}"
          text: "{{ input.text }}"
    # Slack reports most failures as HTTP 200 with { "ok": false, "error": "..." }.
    failure_when:
      - path: ok
        equals: false
        message_path: error
    output:
      type: object
      properties:
        ok: { type: boolean }
        channel: { type: string }
        ts: { type: string }
