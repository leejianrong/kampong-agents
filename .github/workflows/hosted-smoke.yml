name: Hosted smoke

# KAM-340: deploys the server chart to a throwaway kind cluster and drives it over HTTP: deploy, webhook, approve,
# many runs at once, and a two-tenant read that must see nothing. It starts by proving its own isolation check fails
# against a server that leaks. It runs on changes to the server, the chart or itself, on a manual dispatch, and on a
# release tag, where a failure should stop the release. Add it to the branch protection's required checks once it has
# been steady.

on:
  pull_request:
    paths:
      - "packages/server/**"
      - "packages/engine/**"
      - "deploy/**"
      - "scripts/try-cluster.sh"
      - "e2e/hosted-smoke/**"
      - ".github/workflows/hosted-smoke.yml"
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: hosted-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Hosted smoke (kind)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Build the server image
        run: docker build -f packages/server/Dockerfile -t kampong-server:smoke .

      - name: Create a kind cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: smoke

      # The same script a person runs on minikube or k3s (docs/hosted/self-host.md): load the image, start Postgres,
      # create the secrets, install the chart, port-forward and run the smoke flow.
      - name: Install the stack and run the smoke and isolation gate
        env:
          CLUSTER: kind
          IMAGE: kampong-server:smoke
          BUILD: "0"
          KEEP: "0"
        run: scripts/try-cluster.sh

      - name: Show the server's log when it failed
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl logs deploy/kampong-kampong-server --tail=200 || true
          kubectl logs job/kampong-kampong-server-migrate --tail=100 || true
