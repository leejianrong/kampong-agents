name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  lint:
    name: Lint + format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Cross-package imports (e.g. apps/canvas -> @kampong/spec) resolve via
      # each package's "types" field pointing at dist/, which is gitignored
      # and only exists after a build -- this job runs in a fresh checkout,
      # so it needs one before typecheck can see other workspaces' types.
      - run: npm run build
      - run: npm run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Cross-package imports resolve via dist/ (see the typecheck job) --
      # tests that import a workspace package (e.g. apps/canvas importing
      # @kampong/spec) need it built first in a fresh checkout.
      - run: npm run build
      - run: npm run test:unit

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    # KAN-1388: packages/server's RLS/auth integration suites
    # (test/integration/db/*, test/integration/routes/*) skipIf(!DATABASE_URL)
    # and, until now, skipped in CI entirely -- so the tenant-isolation
    # coverage they exist for was never actually exercised on a push. This
    # service + the non-superuser role created below provide a real
    # DATABASE_URL so they run for real. The role MUST be non-superuser and
    # non-BYPASSRLS: a superuser silently bypasses FORCE ROW LEVEL SECURITY,
    # which would make every RLS isolation assertion pass vacuously (and some
    # negative tests fail). See docs/adr/0018 and docs/adr/0019.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # The non-superuser role/database the tables are created in and owned
      # by (so FORCE RLS applies to it). Created in the setup step below.
      DATABASE_URL: postgres://app_test:app_test@localhost:5432/kampong_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      # A NON-superuser, NON-BYPASSRLS role owning its own database. The
      # migrations run as this role (via DATABASE_URL), so it owns the tables
      # and FORCE ROW LEVEL SECURITY genuinely applies to it -- the whole
      # point of KAN-1388. `psql` is preinstalled on ubuntu-latest runners.
      - name: Provision non-superuser Postgres role and database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE app_test LOGIN PASSWORD 'app_test' NOSUPERUSER NOBYPASSRLS;" \
            -c "CREATE DATABASE kampong_test OWNER app_test;"
      - run: npm run test:integration

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:e2e

  browser:
    name: Browser E2E
    runs-on: ubuntu-latest
    # KAN-1228 follow-up: drives the real hosted canvas in a headless browser
    # against a throwaway Postgres -- the whole auth -> workspace -> BYOK ->
    # spec -> run -> approve flow. Same non-superuser role as the integration
    # job (a superuser bypasses FORCE RLS, KAN-1388); the Playwright harness
    # (e2e/browser/harness/server.ts) boots packages/server with the
    # deterministic model seam so the run pauses/completes with no network.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://app_test:app_test@localhost:5432/kampong_e2e
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Provision non-superuser Postgres role and database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE app_test LOGIN PASSWORD 'app_test' NOSUPERUSER NOBYPASSRLS;" \
            -c "CREATE DATABASE kampong_e2e OWNER app_test;"
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:browser
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
